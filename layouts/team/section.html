{{ define "main" }}
  {{ partial "interior-header.html" . }}
  {{ $member := index hugo.Data.team 0 }}
  {{ $content := partial "utils/split-body.html" . }}
  <section class="section">
    <div class="container founder-profile">
      <figure class="founder-profile__portrait">
        {{ partial "utils/image.html" (dict
          "page" .
          "path" $member.image
          "alt" $member.imageAlt
          "widths" (slice 480 768 1200)
          "sizes" "(min-width: 62rem) 400px, (min-width: 48rem) 38vw, 100vw"
          "priority" true) }}
        <figcaption>
          <h2>{{ $member.name }}</h2>
          <p>{{ $member.role }}</p>
        </figcaption>
      </figure>
      <div class="prose founder-profile__bio">{{ $content.intro }}</div>
    </div>
    {{ with $content.body }}
      <div class="container">
        <div class="prose founder-profile__body">{{ . }}</div>
      </div>
    {{ end }}
  </section>
  {{ partial "cta.html" . }}
{{ end }}
