# ---------------------------------------------------------------------------
# Antilo site using the pico-corp demo layout.
# Starter agency copy: see DEMO-CONTENT.md for remaining placeholders.
#
# This is also the file to copy when you start your own site: every parameter
# the theme reads is set here with a real value, so you can see what each one
# does rather than guess from a blank template.
#
# ---------------------------------------------------------------------------

baseURL = 'https://antilodesign.com/'
title = 'Antilo Consulting and Design'
theme = 'hugo-theme-pico-corp'
locale = 'en-US'
defaultContentLanguage = 'en'
timeZone = 'America/Denver'

enableRobotsTXT = true
summaryLength = 22
capitalizeListTitles = false

[pagination]
  pagerSize = 6

[taxonomies]
  category = 'categories'
  tag = 'tags'

[minify]
  minifyOutput = true

[imaging]
  quality = 78
  resampleFilter = 'Lanczos'
  hint = 'photo'

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[services]
  [services.rss]
    limit = 20

