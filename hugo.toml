# ---------------------------------------------------------------------------
# Theme parameters
# ---------------------------------------------------------------------------

# Sub-tables such as [params.address] must come after every plain key in
# [params]: in TOML a table header captures all following keys until the next
# header, so a key written below [params.address] becomes params.address.<key>
# and the theme never sees it.
[params]
  description = 'Antilo Consulting and Antilo Design: Denver-based strategy, websites, and marketing led by David DeBonis, Founder and Lead Consultant.'

  # Company details. Nothing company-specific is hardcoded in the templates.
  companyName = 'Antilo'
  alternateNames = ['Antilo Consulting', 'Antilo Design', 'Antilo Consulting and Design']
  legalName = '' # Add the confirmed legal business name before launch.
  tagline = 'Denver design & marketing'
  # Add founded when the actual year is confirmed.
  email = '' # Add a confirmed public contact email.
  phone = ''
  phoneHref = ''
  vatId = ''
  openingHours = ''

  # Brand. primaryColor drives the generated brand stylesheet; primaryColorDark
  # is used when the dark scheme is active.
  primaryColor = '#34594C'        # Forest green: light-mode buttons and links
  primaryColorDark = '#A8C9B5'    # Light sage-green: dark-mode buttons and links
  radius = '0.5rem'
  # Display face for headings, statistics and pull quotes. 'serif' uses the
  # best serif already installed on the reader's system, which is what gives
  # the theme its editorial feel at zero network cost. 'sans' opts out.
  headingFont = 'serif'
  logo = '/antelope_logo_nobg.png'            # path under assets/, e.g. 'images/logo.svg'. Empty = wordmark.
  logoDark = 'antelope_logo_nobg.png'
  favicon = '/antelope_logo_nobg.svg'
  appleTouchIcon = '/antelope_logo_nobg.png'
  ogImage = ''      # Add an Antilo share image before launch.

  # Colour scheme: 'system', 'light' or 'dark'.
  defaultScheme = 'system'
  showSchemeToggle = true

  showBreadcrumbs = true
  showReadingTime = true
  showRelated = true

  [params.address]
    street = ''
    postalCode = ''
    city = 'Denver'
    region = 'Colorado'
    country = 'United States'
    countryCode = 'US'
    mapURL = ''

  [params.announcement]
    enabled = true
    text = 'For the business you’re building. And the one you’re becoming.'
    linkLabel = 'Start a project'
    linkURL = '/contact/'

  # Site-wide fallback for the closing call to action.
  [params.cta]
    eyebrow = 'Next step'
    title = 'Let’s bring your next chapter into focus.'
    text = 'You know what your business could become. Bring us the idea, the challenge, or the ambition. We’ll help you find the words, design, and direction to move it forward.'
    primaryLabel = 'Start a conversation'
    primaryURL = '/contact/'
    secondaryLabel = 'Explore our services'
    secondaryURL = '/services/'

  [params.footer]
    text = 'Thoughtful strategy, design, and marketing for businesses with something to give. Based in Denver. Invested in what you’re building.'
    note = ''

  [params.seo]
    titleSeparator = '·'
    twitterSite = ''
    twitterCreator = ''
    # Types: Organization, LocalBusiness, ProfessionalService …
    organizationType = 'ProfessionalService'

  # Leave both empty to ship zero third-party requests.
  [params.analytics]
    plausibleDomain = ''
    googleAnalyticsID = ''

  # Point action at Formspree, Netlify Forms or your own endpoint.
  [params.contactForm]
    action = ''
    method = 'POST'
    netlify = false
    successMessage = 'Thanks for getting in touch with Antilo.'

  [[params.social]]
    name = 'RSS'
    icon = 'rss'
    url = '/index.xml'
