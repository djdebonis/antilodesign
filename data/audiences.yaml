- title: "Small businesses, real stakes"
  icon: "compass"
  text: "Your name is on the door and your reputation is personal. Let’s make your care, knowledge, and local character come through before the first conversation."
- title: "Startups finding their voice"
  icon: "spark"
  text: "You know what you’re building. We help make it understandable to someone meeting it for the first time, with a story and presence you can build on."
- title: "Health, with a human voice"
  icon: "bulb"
  text: "People exploring care or wellness bring questions, uncertainty, and hope. Your brand should meet them with understandable language, thoughtful design, and respect."
- title: "Established, still evolving"
  icon: "frame"
  text: "Sometimes the business has moved forward and the brand has stayed behind. We help close that gap while keeping what people already know and value."
