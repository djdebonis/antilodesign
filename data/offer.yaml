- title: "Decide where to focus"
  icon: "compass"
  text: "We review your offer, customer questions, and existing marketing. We identify what needs attention and explain which changes we recommend first, and why."
- title: "Find the words"
  icon: "bulb"
  text: "We turn your knowledge of the business into language customers can use to make a decision: what you do, who it is for, and why they would choose you."
- title: "Build the work"
  icon: "frame"
  text: "We carry the direction into websites, email, packaging, content creation, advertising, and printed materials. We connect the message with the places people discover and buy from your business."
- title: "Keep it useful"
  icon: "check-circle"
  text: "We help maintain the work, review the response, and organize customer follow-up. We agree on responsibilities so the plan fits the people and time available."
