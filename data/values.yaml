- title: "Sound like yourself"
  icon: "compass"
  text: "Your language, your convictions, your way of helping people. The work should make those easier to recognize."
- title: "Earn the attention"
  icon: "frame"
  text: "Give people something useful to read, a reason to care, and a clear way forward. Their time matters too."
- title: "Make considered choices"
  icon: "check-circle"
  text: "A small budget deserves careful thinking. Choose the work that addresses a real need, and know why it comes first."
- title: "Stay curious"
  icon: "bulb"
  text: "Ask another question. Listen to the answer. Let what we learn about the business shape what we make."
